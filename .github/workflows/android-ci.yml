name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug builds
        run: ./gradlew testDebugUnitTest lintDebug :shared:assembleDebugAndroidTest :app:assembleDebug :wear:assembleDebug

      - name: Verify 16 KB native-library alignment
        run: ./scripts/check-16kb-alignment.sh app/build/outputs/apk/debug/app-debug.apk wear/build/outputs/apk/debug/wear-debug.apk

      - name: Verify committed Room schema
        run: git diff --exit-code -- shared/schemas

      - name: Run Room migration chain on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :shared:connectedDebugAndroidTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
